name: Generate Animated Green Contribution Matrix

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Live Glowing Green Contribution Matrix & Velocity Wave
        run: |
          python3 .github/scripts/generate_contrib_pulse.py --username "${{ github.repository_owner }}" --theme dark --out dist/contrib-pulse-dark.svg
          python3 .github/scripts/generate_contrib_pulse.py --username "${{ github.repository_owner }}" --theme light --out dist/contrib-pulse-light.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
